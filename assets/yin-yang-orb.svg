<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 224" width="224" height="224" role="img" aria-label="Hakurei Yin-Yang Orb">
  <defs>
    <radialGradient id="orbShade" cx="34%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="46%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#5b0a12" stop-opacity="0.26"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="84%"  stop-color="#ff5a6e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff5a6e" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="orbSpec" cx="34%" cy="26%" r="30%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7a0c1c" flood-opacity="0.32"/>
    </filter>
    <clipPath id="orbClip"><circle cx="112" cy="112" r="100"/></clipPath>
  </defs>

  <g filter="url(#orbSoft)">
    <circle cx="112" cy="112" r="100" fill="#fbf8f8"/>

    <g clip-path="url(#orbClip)">
      <path d="M 112 12 A 100 100 0 0 1 112 212 A 50 50 0 0 0 112 112 A 50 50 0 0 1 112 12 Z" fill="#e0070f"/>
      <!-- 上半小圆在红色区里 -> 白点（阴中有阳） -->
      <circle cx="112" cy="62" r="17.0" fill="#fbf8f8"/>
      <!-- 下半小圆在白色区里 -> 红点（阳中有阴） -->
      <circle cx="112" cy="162" r="17.0" fill="#e0070f"/>
    </g>

    <circle cx="112" cy="112" r="100" fill="url(#orbShade)"/>
    <circle cx="112" cy="112" r="100" fill="url(#orbGlow)"/>
    <circle cx="112" cy="112" r="100" fill="url(#orbSpec)"/>
    <circle cx="112" cy="112" r="100" fill="none" stroke="#8e0a16" stroke-width="3" stroke-opacity="0.5"/>
  </g>
</svg>
